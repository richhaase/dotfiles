format = "$username$hostname$directory$git_branch$git_state$git_status$direnv$fill$status$cmd_duration$shlvl\n$character"
add_newline = true
scan_timeout = 50
command_timeout = 500

[username]
format = "[$user]($style)"
style_user = "bold yellow"
style_root = "bold red"
show_always = false

[hostname]
format = "[@$hostname]($style) "
style = "bold green"
ssh_only = true
ssh_symbol = " "

[shlvl]
format = "[↕$shlvl]($style) "
style = "bold yellow"
threshold = 2
disabled = false

[directory]
style = "bold blue"
truncation_length = 5
truncate_to_repo = false
read_only = " 󰌾"

[fill]
symbol = " "

[git_branch]
format = "on [$symbol$branch]($style) "
style = "bold purple"
symbol = " "

[git_commit]
format = "[\\($hash$tag\\)]($style) "
style = "bold purple"
only_detached = true
tag_disabled = false
tag_symbol = " 🏷 "
commit_hash_length = 7

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold red"
conflicted = "✖ "
staged = "+ "
modified = "! "
untracked = "? "
deleted = "✘ "
renamed = "» "
stashed = "\\$ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕ "

[git_state]
format = "[($state( $progress_current/$progress_total))]($style) "
style = "yellow"

[direnv]
format = "[⛶ direnv]($style) "
style = "bold cyan"
disabled = false

[status]
format = "[✗ $status]($style) "
style = "bold red"
disabled = false
pipestatus = true
map_symbol = true
recognize_signal_code = true

[cmd_duration]
min_time = 1500
format = "[⏱ $duration]($style) "
style = "dim cyan"
show_milliseconds = false

# keep prompt snappy
[package]
disabled = true
[docker_context]
disabled = true
[kubernetes]
disabled = true
[aws]
disabled = true
