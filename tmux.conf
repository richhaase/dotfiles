# -- General --
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Lower escape delay (helps with helix)
set -sg escape-time 10

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -- Keybinds --

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Zoom toggle reminder: prefix + z

# Saner splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane switching (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane switching with alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Quick window switching with shift+arrow (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# -- Status bar --
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[bold]#S  "
set -g status-left-length 20
set -g status-right ""
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour75,fg=colour235,bold] #I:#W "

# -- Pane visibility --
# Slightly darken inactive pane backgrounds
set -g window-style "bg=colour233"
set -g window-active-style "bg=terminal"

# Subtle inactive border, bright active border
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour75"
