[notebook]
dir = "$HOME/notebook"

[tool]
editor = "nvim"
shell = "/bin/zsh"
pager = "less -FIRX"
fzf-preview = "bat -p --color always {-1}"

[extra]
author = "Rich"

[group.daily]
paths = ["daily"]

[group.daily.note]
filename = "{{format-date now}}"
extension = "md"
template = "daily.md"

[format.markdown]
hashtags = true
colon-tags = true

[alias]
last = "zk edit --limit 1 --sort modified- $argv"
recent = "zk edit --sort created- --created-after 'last two weeks' --interactive"
ls = "zk edit --interactive"
tag = "zk edit --interactive --tag $argv"
config = 'nvim "$HOME/.config/zk/config.toml"'
daily = 'zk new --no-input "$ZK_NOTEBOOK_DIR/daily"'
thought = 'zk new --no-input "$ZK_NOTEBOOK_DIR/thoughts" --title $argv'

[lsp]

[lsp.diagnostics]
wiki-title = "hint"
dead-link = "error"
