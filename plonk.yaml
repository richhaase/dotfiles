settings:
    default_manager: homebrew
dotfiles:
    - source: dot_zshrc
      destination: ~/.zshrc
    - source: dot_gitconfig
      destination: ~/.gitconfig
    - source: dot_zshenv
      destination: ~/.zshenv
    - source: dot_vimrc
      destination: ~/.vimrc
homebrew:
    brews:
        - git
        - curl
        - jq
npm:
    - prettier
    - typescript
