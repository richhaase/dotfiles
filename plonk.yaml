expand_directories:
    - .claude
    - .config
    - .codex
    - .gemini
ignore_patterns:
    - __pycache__
    - codex/AGENTS.md
    - /AGENTS.md
    - README.md
    - .DS_Store
    - .Trash
    - .CFUserTextEncoding
    - .cups
    - .git
    - '*.backup'
    - '*.tmp'
    - '*.swp'
    - plonk.lock
    - .cache
    - .npm
    - .gem
    - .cargo
    - .rustup
    - .bundle
    - .local
    - .ollama
    - '*_history'
    - '*.lesshst'
    - .cursor
    - .lima
    - .colima
    - .cdk
    - .magefile
    - .ssh
    - .gnupg
    - '*_token'
    - '*.pem'
    - '*.key'
